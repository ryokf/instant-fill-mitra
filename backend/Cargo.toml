[package]
name = "instant-fill-backend"
version = "1.0.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
clap = { version = "4.6.7", features = ["derive"] }
dotenvy = "0.15"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp"] }
regex = "1.13.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors"] }
windows = { version = "0.62.2", features = ["Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Storage", "Foundation", "Foundation_Collections", "Data_Pdf"] }
