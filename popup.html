<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: Arial, sans-serif; width: 300px; padding: 10px; }
    h3 { margin-top: 0; font-size: 14px; border-bottom: 1px solid #ccc; padding-bottom: 5px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 12px; margin-bottom: 5px; font-weight: bold; }
    select, button { width: 100%; padding: 8px; box-sizing: border-box; }
    button { background-color: #26B99A; color: white; border: none; cursor: pointer; border-radius: 3px; margin-top: 5px;}
    button:hover { background-color: #169F85; }
    .divider { border-top: 1px dashed #ccc; margin: 15px 0; }
    .status { font-size: 11px; padding: 6px 8px; border-radius: 3px; margin-bottom: 10px; background: #f2f2f2; color: #555; }
    .status.ok { background: #e6f7f2; color: #137a63; }
    .status.warn { background: #fff4e0; color: #8a5a00; }
    .redetect { font-size: 11px; color: #26B99A; cursor: pointer; text-decoration: underline; float: right; }
    .hint { font-weight: normal; color: #888; font-size: 11px; }
    .person-list { list-style: none; margin: 0; padding: 0; max-height: 260px; overflow-y: auto; border: 1px solid #ddd; border-radius: 3px; }
    .person-list li { padding: 7px 9px; border-bottom: 1px solid #eee; font-size: 12px; cursor: pointer; }
    .person-list li:last-child { border-bottom: none; }
    .person-list li:hover { background: #e6f7f2; }
    .person-list li.active { background: #26B99A; color: #fff; }
    .person-list li .nik { display: block; font-size: 10px; color: #888; margin-top: 2px; }
    .person-list li.active .nik { color: #e6f7f2; }
    .person-list li.empty { cursor: default; color: #999; font-style: italic; }
    .person-list li.empty:hover { background: none; }
  </style>
</head>
<body>
  <h3>AutoFill Akta Jual Beli <a id="btn-redetect" class="redetect" title="Baca ulang Daftar Penjual di halaman">Deteksi ulang</a></h3>

  <div id="detect-status" class="status">Membaca data penjual di halaman...</div>
  
  <div class="form-group">
    <label>Pilih Penjual (PT):</label>
    <select id="select-pt">
      <option value="">-- Pilih PT --</option>
    </select>
    <button id="btn-fill-penjual">Isi Form Penjual</button>
  </div>

  <div class="divider"></div>

  <div class="form-group">
    <label>Pihak Persetujuan <span class="hint">(klik nama untuk mengisi form)</span>:</label>
    <ul id="list-persetujuan" class="person-list">
      <li class="empty">-- Pilih PT Dulu --</li>
    </ul>
  </div>

  <script src="popup.js"></script>
</body>
</html>
